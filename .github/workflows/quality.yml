name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:seed
      - run: npm run test:scripts
      - run: npm run test:boundaries
      - run: npm run test:search
      - run: npm run test:reads
      - run: npm run test:digest
      - run: npm run test:radar
      - run: npm run test:community
      - run: npm run test:media
      - run: npm run test:seo
      - run: npm run test:admin
      - run: npm run test:backup
      - run: npm run test:shorts
      - run: npm run lint -- --quiet
      - run: npm run typecheck
      - run: npm run build
