name: Radar (hourly content update)

on:
  schedule:
    # Every hour at minute 7. For every 6 hours use: "7 */6 * * *"
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: content-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional repo variables (Settings → Secrets and variables → Actions → Variables)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_RADAR_MODEL: ${{ vars.OPENAI_RADAR_MODEL }}
          RADAR_BEAMS: ${{ vars.RADAR_BEAMS }}
          UPDATE_MAX_ITEMS: ${{ vars.UPDATE_MAX_ITEMS }}
          ENRICH_PER_RUN: ${{ vars.ENRICH_PER_RUN }}
      - name: Find pictures for catalog entries that still have none
        run: npm run catalog-images -- --count=10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      - name: Commit new catalog images
        run: |
          if ! git diff --quiet data/catalog-images.json; then
            git config user.name "arabicgta6-radar"
            git config user.email "radar@users.noreply.github.com"
            git add data/catalog-images.json
            git commit -m "Radar: catalog images"
            git push
          fi
