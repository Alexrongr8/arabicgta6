name: Radar (news + shorts every hour)

on:
  schedule:
    # Primary trigger: Supabase pg_cron dispatches this workflow hourly (GitHub's own cron is
    # best-effort and fired only ~5 of 48 hours on 22-24 Nov). This cron is a backup only; the
    # radar skips a scheduled start that follows another run within 40 minutes. Public repo since
    # 24 Nov 2026, so Actions minutes are free and the radar runs around the clock.
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: content-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    # Paid automation is off unless the repo variable CONTENT_AUTOMATION_ENABLED is exactly "true".
    if: ${{ vars.CONTENT_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Reuse node_modules between hourly runs (saves ~30s of billed minutes per run).
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Collect new GTA 6 Shorts (free, no AI)
        run: npm run shorts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional repo variables (Settings → Secrets and variables → Actions → Variables)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_RADAR_MODEL: ${{ vars.OPENAI_RADAR_MODEL }}
          RADAR_BEAMS: ${{ vars.RADAR_BEAMS }}
          UPDATE_MAX_ITEMS: ${{ vars.UPDATE_MAX_ITEMS }}
          ENRICH_PER_RUN: ${{ vars.ENRICH_PER_RUN }}
