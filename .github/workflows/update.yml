name: Radar (hourly content update)

on:
  schedule:
    # Every hour at minute 7. For every 6 hours use: "7 */6 * * *"
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional repo variables (Settings → Secrets and variables → Actions → Variables)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_RADAR_MODEL: ${{ vars.OPENAI_RADAR_MODEL }}
          RADAR_BEAMS: ${{ vars.RADAR_BEAMS }}
          UPDATE_MAX_ITEMS: ${{ vars.UPDATE_MAX_ITEMS }}
          ENRICH_PER_RUN: ${{ vars.ENRICH_PER_RUN }}
